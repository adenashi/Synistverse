<div>
    <p class="subheading">
        Everything that I've designed for the game so far.
    </p>
</div>
<div class="row">
    <div class=""col>
        <h3 align="center">Gameplay</h3>
        <ul class="plain-list">
            {% for post in collections.Gameplay %}
            <li align="center"><a href="{{post.url}}">{{ post.data.title}}</a></li>
            {% endfor %}
        </ul>
    </div>
</div>

<h3 align="center">Cards</h3>
<div class="row">
    <ul class="plain-list">
        <div class="newspaper">
            {% for post in collections.Cards %}
            <li align="center"><a href="{{post.url}}">{{ post.data.title}}</a></li>
            {% endfor %}
        </div>
    </ul>
</div>
