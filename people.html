---
layout: layout.html
title: People
---

<div>
    <p class="subheading">
        Information about the inhabitants of Haenem.
    </p>
</div>

<div class="row">
    <div class=""col>
        <h3 align="center">Groups</h3>
        <ul class="plain-list">
            {% for post in collections.People %}
            <li align="center"><a href="{{post.url}}">{{ post.data.title}}</a></li>
            {% endfor %}
        </ul>
    </div>
</div>

<h3 align="center">Characters</h3>
<div class="row">
    <ul class="plain-list">
        <div class="newspaper">
            {% for post in collections.Characters %}
            <li align="center"><a href="{{post.url}}">{{ post.data.title}}</a></li>
            {% endfor %}
        </div>
    </ul>
</div>
